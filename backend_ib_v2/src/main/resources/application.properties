spring.application.name=imoveis
server.port=8080

# PostgreSQL portátil criado pelo INICIAR.bat (porta 5544). Pode sobrescrever com variáveis de ambiente.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5544/imoveis_bretas}
spring.datasource.username=${DB_USER:bretas}
spring.datasource.password=${DB_PASSWORD:bretas123}

# Cria/atualiza as tabelas a partir das entidades JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# JWT
jwt.secret=${JWT_SECRET:troque-esta-chave-secreta-com-pelo-menos-32-caracteres}
jwt.expiration-hours=8

# Front-end autorizado (CORS)
app.cors.allowed-origin=http://localhost:5173
